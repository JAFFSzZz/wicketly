<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8df">
  <meta name="description" content="Wicketly is a playful cricket scoreboard for club matches, backyard games and nets.">
  <title>Wicketly — Let the game begin!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="#" id="homeLink" aria-label="Wicketly home">
        <span class="mark" aria-hidden="true">W</span>
        <span><strong>wicketly</strong><small>LET THE GAME BEGIN!</small></span>
      </a>
      <div class="header-right">
        <span class="local-save" id="saveStatus">Saved on this device</span>
        <div class="theme-switch" role="group" aria-label="Colour theme">
          <button class="theme-choice" id="lightTheme" type="button" aria-pressed="true" title="Light theme">☀ <span>Day</span></button>
          <button class="theme-choice" id="darkTheme" type="button" aria-pressed="false" title="Dark theme">☾ <span>Night</span></button>
        </div>
        <button class="text-button" id="newMatchBtn" type="button">＋ New match</button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="site-footer">
      <div class="footer-inner"><span>© 2026 Wicketly · Made for the love of cricket 🏏</span>
        <nav class="footer-links"><a href="#terms" data-page="terms">Terms</a><a href="#privacy" data-page="privacy">Privacy</a></nav>
      </div>
    </footer>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal"><div class="modal-ball" aria-hidden="true">🏏</div><h2 id="modalTitle"></h2><div id="modalContent"></div><div class="error" id="modalError" role="alert"></div>
      <div class="modal-actions"><button class="button" id="modalCancel" type="button">Cancel</button><button class="button primary" id="modalSave" type="button">Let's go!</button></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
